# Serves the built frontend and forwards API requests to the backend service, so
# the browser sees one origin and no CORS configuration is needed.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    # /healthz is forwarded too, so the health check covers nginx and the backend.
    location ~ ^/(api/|healthz$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
